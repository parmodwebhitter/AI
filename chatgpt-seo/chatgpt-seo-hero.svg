<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="t d" font-family="Poppins,system-ui,sans-serif">
  <title id="t">ChatGPT recommends your brand</title>
  <desc id="d">A ChatGPT answer naming your brand as the top recommendation, with an AI visibility score of 87 and AI mentions up 240 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b3f"/><stop offset=".55" stop-color="#1e3a8a"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <radialGradient id="b1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" opacity=".12"/></pattern>
    <clipPath id="panel"><rect x="0" y="0" width="640" height="600" rx="40"/></clipPath>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020617" flood-opacity=".45"/></filter>
    <filter id="sm" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/></filter>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#60a5fa" flood-opacity=".9"/></filter>
  </defs>

  <!-- backdrop panel -->
  <g clip-path="url(#panel)">
    <rect width="640" height="600" fill="url(#bg)"/>
    <rect width="640" height="600" fill="url(#dots)"/>
    <circle cx="560" cy="80" r="230" fill="url(#b1)"/>
    <circle cx="70" cy="540" r="260" fill="url(#b2)"/>
    <g fill="none" stroke="#fff" stroke-opacity=".09">
      <circle cx="320" cy="306" r="200"/><circle cx="320" cy="306" r="270"/><circle cx="320" cy="306" r="340"/>
    </g>
    <circle cx="122" cy="300" r="5" fill="#67e8f9"/><circle cx="586" cy="360" r="4" fill="#c4b5fd"/><circle cx="420" cy="88" r="3" fill="#fff" opacity=".7"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff">
    <path d="M80 82c1.6 9 5 12.4 14 14-9 1.6-12.4 5-14 14-1.6-9-5-12.4-14-14 9-1.6 12.4-5 14-14z" opacity=".9"/>
    <path d="M590 268c1 5.6 3.2 7.8 8.8 8.8-5.6 1-7.8 3.2-8.8 8.8-1-5.6-3.2-7.8-8.8-8.8 5.6-1 7.8-3.2 8.8-8.8z" opacity=".7"/>
    <path d="M420 520c1 5.6 3.2 7.8 8.8 8.8-5.6 1-7.8 3.2-8.8 8.8-1-5.6-3.2-7.8-8.8-8.8 5.6-1 7.8-3.2 8.8-8.8z" opacity=".6"/>
  </g>

  <!-- ===== main chat card ===== -->
  <g filter="url(#sh)"><rect x="128" y="112" width="384" height="346" rx="26" fill="#fff"/></g>
  <rect x="148" y="132" width="34" height="34" rx="10" fill="#0f172a"/>
  <svg x="155" y="139" width="20" height="20" viewBox="0 0 512 512" fill="#fff"><path d="M196.4 185.8v-48.6c0-4.1 1.5-7.2 5.1-9.2l97.8-56.3c13.3-7.7 29.2-11.3 45.6-11.3 61.4 0 100.4 47.6 100.4 98.3 0 3.6 0 7.7-.5 11.8l-101.5-59.4c-6.1-3.6-12.3-3.6-18.4 0zm228.3 189.4V259c0-7.2-3.1-12.3-9.2-15.9L287 168.4l42-24.1c3.6-2 6.7-2 10.2 0l97.8 56.4c28.2 16.4 47.1 51.2 47.1 85 0 38.9-23 74.8-59.4 89.6zM166.2 272.8l-42-24.6c-3.6-2-5.1-5.1-5.1-9.2V126.4c0-54.8 42-96.3 98.8-96.3 21.5 0 41.5 7.2 58.4 20l-100.9 58.4c-6.1 3.6-9.2 8.7-9.2 15.9v148.5zm90.4 52.2-60.2-33.8v-71.7l60.2-33.8 60.2 33.8v71.7zm38.7 155.7c-21.5 0-41.5-7.2-58.4-20l100.9-58.4c6.1-3.6 9.2-8.7 9.2-15.9V237.9l42.5 24.6c3.6 2 5.1 5.1 5.1 9.2v112.6c0 54.8-42.5 96.3-99.3 96.3zM173.8 366.5l-97.7-56.3C47.9 293.8 29 259 29 225.2c0-39.4 23.6-74.8 59.9-89.6v116.7c0 7.2 3.1 12.3 9.2 15.9l128 74.2-42 24.1c-3.6 2-6.7 2-10.2 0zm-5.6 84c-57.9 0-100.4-43.5-100.4-97.3 0-4.1.5-8.2 1-12.3l100.9 58.4c6.1 3.6 12.3 3.6 18.4 0l128.5-74.2v48.6c0 4.1-1.5 7.2-5.1 9.2l-97.8 56.3c-13.3 7.7-29.2 11.3-45.6 11.3zm127 60.9c62 0 113.7-44 125.4-102.4 57.3-14.9 94.2-68.6 94.2-123.4 0-35.8-15.4-70.7-43-95.7 2.6-10.8 4.1-21.5 4.1-32.3 0-73.2-59.4-128-128-128-13.8 0-27.1 2-40.4 6.7-23-22.5-54.8-36.9-89.6-36.9-62 0-113.7 44-125.4 102.4-57.3 14.8-94.2 68.6-94.2 123.4 0 35.8 15.4 70.7 43 95.7-2.6 10.8-4.1 21.5-4.1 32.3 0 73.2 59.4 128 128 128 13.8 0 27.1-2 40.4-6.7 23 22.5 54.8 36.9 89.6 36.9"/></svg>
  <text x="194" y="147" font-size="14.5" font-weight="700" fill="#0f172a">ChatGPT</text>
  <text x="194" y="163" font-size="11" fill="#64748b">Searched 24 sites</text>
  <rect x="424" y="138" width="68" height="24" rx="12" fill="#eef2ff"/>
  <circle cx="438" cy="150" r="3.5" fill="#22c55e"/>
  <text x="446" y="154.5" font-size="11" font-weight="600" fill="#4338ca">Search</text>
  <line x1="148" y1="182" x2="492" y2="182" stroke="#eef2f7"/>

  <!-- user prompt -->
  <rect x="264" y="198" width="228" height="40" rx="20" fill="#f1f5f9"/>
  <text x="378" y="222.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">Best AI SEO agency for SaaS?</text>

  <!-- answer intro -->
  <text x="148" y="266" font-size="12.5" fill="#334155">Based on reviews and expert lists, the</text>
  <text x="148" y="284" font-size="12.5" fill="#334155">top recommendation is:</text>

  <!-- #1 your brand -->
  <rect x="148" y="300" width="344" height="88" rx="18" fill="#fff" filter="url(#glow)"/>
  <rect x="148" y="300" width="344" height="88" rx="18" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <rect x="164" y="316" width="44" height="44" rx="13" fill="url(#acc)"/>
  <path d="M175 339l7 7 15-16" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="222" y="334" font-size="16" font-weight="700" fill="#0f172a">Your Brand</text>
  <path d="M227 342.5l2 4.1 4.5.6-3.3 3.1.8 4.5-4-2.2-4 2.2.8-4.5-3.3-3.1 4.5-.6z" fill="#f59e0b"/>
  <text x="237" y="354" font-size="11.5" font-weight="600" fill="#0f172a">4.9</text>
  <text x="259" y="354" font-size="11.5" fill="#64748b">· Trusted by 100+ brands</text>
  <rect x="410" y="314" width="68" height="24" rx="12" fill="#dcfce7"/>
  <text x="444" y="330.5" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">#1 PICK</text>
  <g font-size="10.5" font-weight="600" fill="#475569">
    <rect x="222" y="364" width="44" height="17" rx="8.5" fill="#f1f5f9"/><text x="244" y="376" text-anchor="middle">G2</text>
    <rect x="272" y="364" width="56" height="17" rx="8.5" fill="#f1f5f9"/><text x="300" y="376" text-anchor="middle">Reddit</text>
    <rect x="334" y="364" width="60" height="17" rx="8.5" fill="#f1f5f9"/><text x="364" y="376" text-anchor="middle">Forbes</text>
  </g>

  <!-- #2 / #3 competitors -->
  <g opacity=".55">
    <rect x="148" y="402" width="344" height="40" rx="14" fill="#f8fafc"/>
    <text x="166" y="427" font-size="12.5" font-weight="600" fill="#64748b">2</text>
    <text x="186" y="427" font-size="12.5" font-weight="500" fill="#475569">Competitor A</text>
  </g>

  <!-- ===== floating: visibility score (top right) ===== -->
  <g filter="url(#sm)"><rect x="452" y="36" width="164" height="104" rx="20" fill="#fff"/></g>
  <text x="470" y="62" font-size="11" font-weight="500" fill="#64748b">AI visibility</text>
  <text x="470" y="98" font-size="26" font-weight="700" fill="#0f172a">A+</text>
  <text x="470" y="122" font-size="11" font-weight="600" fill="#16a34a">▲ 32 pts</text>
  <circle cx="576" cy="96" r="24" fill="none" stroke="#e0e7ff" stroke-width="7"/>
  <circle cx="576" cy="96" r="24" fill="none" stroke="url(#acc)" stroke-width="7" stroke-linecap="round" stroke-dasharray="131.2 150.8" transform="rotate(-90 576 96)"/>
  <text x="576" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">87</text>

  <!-- ===== floating: mentions chart (bottom left) ===== -->
  <g filter="url(#sm)"><rect x="28" y="466" width="196" height="118" rx="20" fill="#fff"/></g>
  <text x="46" y="490" font-size="11" font-weight="500" fill="#64748b">AI mentions</text>
  <text x="46" y="516" font-size="24" font-weight="700" fill="#0f172a">+240%</text>
  <path d="M46 566 L76 560 L104 562 L132 550 L160 544 L188 530 L206 524 L206 570 L46 570 Z" fill="url(#area)"/>
  <polyline points="46,566 76,560 104,562 132,550 160,544 188,530 206,524" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="206" cy="524" r="4.5" fill="#fff" stroke="#16a34a" stroke-width="2.6"/>

  <!-- ===== floating pill: cited (left) ===== -->
  <g filter="url(#sm)"><rect x="30" y="196" width="146" height="44" rx="22" fill="#fff"/></g>
  <circle cx="54" cy="218" r="12" fill="#dcfce7"/>
  <path d="M48.5 218.5l3.8 3.8 7.2-7.6" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="74" y="223" font-size="12" font-weight="600" fill="#0f172a">Cited by AI</text>

  <!-- ===== floating pill: prompts won (right) ===== -->
  <g filter="url(#sm)"><rect x="468" y="414" width="150" height="58" rx="18" fill="#fff"/></g>
  <text x="486" y="436" font-size="10.5" font-weight="500" fill="#64748b">Prompts won</text>
  <text x="486" y="459" font-size="16" font-weight="700" fill="#0f172a">18 / 25</text>
  <rect x="562" y="447" width="42" height="8" rx="4" fill="#e0e7ff"/>
  <rect x="562" y="447" width="30" height="8" rx="4" fill="url(#acc)"/>
</svg>
